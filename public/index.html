<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barometric</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6.5' fill='none' stroke='%232a78d6' stroke-width='1.5'/><path d='M8 8 L11.5 5' stroke='%232a78d6' stroke-width='1.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1>Barometric</h1>
    <label class="field">
      <span class="sr-only">Location</span>
      <select id="location"></select>
    </label>
    <span id="status" class="muted"></span>
    <div class="log-actions" role="group" aria-label="Log">
      <div class="split">
        <button type="button" class="log-now" data-kind="pre-migraine">Pre-migraine</button>
        <button type="button" class="log-more" data-kind="pre-migraine" aria-haspopup="dialog" aria-label="Pre-migraine: set time or add a note">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="split">
        <button type="button" class="log-now" data-kind="migraine">Migraine</button>
        <button type="button" class="log-more" data-kind="migraine" aria-haspopup="dialog" aria-label="Migraine: set time or add a note">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <dialog id="log-dialog" aria-labelledby="log-title">
    <form method="dialog" id="log-form">
      <h2 id="log-title">Log</h2>
      <div class="seg" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="kind" value="pre-migraine"> Pre-migraine</label>
        <label><input type="radio" name="kind" value="migraine"> Migraine</label>
      </div>
      <label class="stack"><span>When <span class="muted" id="log-zone"></span></span><input type="datetime-local" id="log-when" required></label>
      <label class="stack">Note <input type="text" id="log-note" maxlength="500" placeholder="Optional"></label>
      <div class="actions">
        <button type="submit" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <main>
    <section class="controls" aria-label="Filters">
      <div class="seg" role="group" aria-label="Range" id="range">
        <button data-days="1">24 h</button>
        <button data-days="7">7 d</button>
        <button data-days="30">30 d</button>
        <button data-days="90">90 d</button>
        <button data-days="365">1 y</button>
      </div>
      <div class="seg" role="group" aria-label="Pressure" id="field">
        <button data-field="surface" title="Pressure at ground level">Surface</button>
        <button data-field="msl" title="Reduced to sea level, comparable across places">Sea level</button>
      </div>
      <div class="seg" role="group" aria-label="Sources" id="sources">
        <button data-source="open-meteo"><i class="key key-1"></i>Open-Meteo</button>
        <button data-source="nws"><i class="key key-2"></i>NWS</button>
      </div>
      <div class="seg" role="group" aria-label="Forecast" id="forecast">
        <button data-days="0">No forecast</button>
        <button data-days="2"><i class="key key-forecast"></i>2 d</button>
        <button data-days="7"><i class="key key-forecast"></i>7 d</button>
      </div>
      <div class="seg" role="group" aria-label="Units" id="units">
        <button data-units="metric">hPa · °C</button>
        <button data-units="us">inHg · °F</button>
      </div>
    </section>

    <section class="controls swing-controls" aria-label="Swing detection">
      <span class="label">Highlight swings of</span>
      <input id="threshold" type="number" min="0" step="any" inputmode="decimal" aria-label="Swing threshold">
      <span id="threshold-unit" class="muted"></span>
      <span class="label">within</span>
      <input id="window" type="number" min="1" max="72" step="1" inputmode="numeric" aria-label="Swing window in hours">
      <span class="muted">h, from</span>
      <select id="swing-source" aria-label="Swing source">
        <option value="open-meteo">Open-Meteo</option>
        <option value="nws">NWS</option>
      </select>
      <span class="legend-chip"><i class="band band-fall"></i>Falling</span>
      <span class="legend-chip"><i class="band band-rise"></i>Rising</span>
      <span class="legend-chip"><i class="mark mark-migraine"></i>Migraine</span>
      <span class="legend-chip"><i class="mark mark-pre-migraine"></i>Pre-migraine</span>
    </section>

    <section class="upcoming" id="upcoming" aria-label="Forecast swings" hidden>
      <h2>Upcoming shifts <span class="muted" id="upcoming-note"></span></h2>
      <ul id="upcoming-list"></ul>
    </section>

    <section class="tiles" id="tiles" aria-label="Current pressure"></section>

    <p id="empty" class="empty" hidden></p>

    <section class="charts">
      <figure class="chart">
        <figcaption>Pressure <span class="muted" id="pressure-caption"></span></figcaption>
        <div id="chart-pressure"></div>
      </figure>
      <figure class="chart">
        <figcaption>Temperature</figcaption>
        <div id="chart-temp"></div>
      </figure>
      <figure class="chart">
        <figcaption>Precipitation <span class="muted">per hour</span></figcaption>
        <div id="chart-precip"></div>
      </figure>
      <figure class="chart">
        <figcaption>Rain chance <span class="muted">Open-Meteo only</span></figcaption>
        <div id="chart-prob"></div>
      </figure>
      <p class="hint muted">Drag across a chart to zoom. Double-click to reset.</p>
    </section>

    <section class="swings">
      <h2>Swings <span class="muted" id="swing-count"></span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Start</th><th>End</th><th class="num">Hours</th><th class="num">Change</th><th class="num">Peak rate</th></tr>
          </thead>
          <tbody id="swing-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="swings">
      <h2>Migraine log <span class="muted" id="event-count"></span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>When</th><th>Type</th><th class="num">Pressure</th><th class="num">24 h change</th><th>Note</th><th><span class="sr-only">Actions</span></th></tr>
          </thead>
          <tbody id="event-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/vendor/uPlot.iife.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
